services:
  postgres:
    image: postgres:16-alpine
    container_name: rental-db-dev
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: rental
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  pg_dev_data:
